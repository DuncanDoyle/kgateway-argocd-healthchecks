tests:
- healthStatus:
    status: Healthy
    message: Policy accepted
  inputPath: testdata/healthy.yaml
- healthStatus:
    status: Degraded
    message: 'extauth: httpbin/no-such-gateway-extension: gateway extension not found'
  inputPath: testdata/degraded.yaml
# Target does not exist. v2.5.x reports it as Accepted=False/TargetNotFound on a
# synthetic StatusSummary ancestor; v2.4.x writes no status at all.
- healthStatus:
    status: Degraded
    message: "HTTPRoute scenarios/no-such-route not found"
  inputPath: testdata/target_missing.yaml
- healthStatus:
    status: Progressing
    message: "Waiting for TrafficPolicy status"
  inputPath: testdata/target_missing_v2_4.yaml
# The foreign ancestor is Invalid but owned by another controller, so the
# result must be identical to healthy.yaml.
- healthStatus:
    status: Healthy
    message: Policy accepted
  inputPath: testdata/foreign_controller.yaml
- healthStatus:
    status: Degraded
    message: "Policy is overridden by a more specific policy"
  inputPath: testdata/overridden.yaml
- healthStatus:
    status: Degraded
    message: "Policy was partially accepted"
  inputPath: testdata/partially_valid.yaml
# Real empty message (observed on degraded.yaml's Attached/Pending condition)
# relocated onto a DEGRADED_REASON branch, so the fallback text is actually
# read rather than short-circuited by the Pending check.
- healthStatus:
    status: Degraded
    message: "Attached: Overridden"
  inputPath: testdata/overridden_empty_message.yaml
- healthStatus:
    status: Progressing
    message: "Waiting for TrafficPolicy status"
  inputPath: testdata/stale.yaml
# conditions-shaped status where ancestors-shaped is expected: must not
# produce a verdict.
- healthStatus:
    status: Progressing
    message: "Waiting for TrafficPolicy status"
  inputPath: testdata/wrong_shape.yaml
