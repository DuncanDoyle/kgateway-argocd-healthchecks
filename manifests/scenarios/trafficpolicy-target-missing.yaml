# Targets an HTTPRoute that does not exist. v2.5.x writes Accepted=False/
# TargetNotFound on a synthetic StatusSummary ancestor -> Degraded. v2.4.x
# writes no status at all -> Progressing.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: tp-target-missing
  namespace: scenarios
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: no-such-route
  headerModifiers:
    request:
      set:
      - name: X-Never-Applied
        value: "true"
